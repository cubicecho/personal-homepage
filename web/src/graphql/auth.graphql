query Access {
  access {
    mode
    canView
    canEdit
    viewer {
      id
      name
      email
      groups
      isAdmin
      via
    }
  }
}

query AuthConfig {
  authConfig {
    mode
    forwardAuth
    publicView
    sso {
      name
      signInUrl
    }
  }
}

fragment SsoSetupFields on SsoSetup {
  source
  issuer
  name
  canPair
  redirectUri
  appUrl
  appUrlSource
  callbackIsLocal
}

query SsoSetup {
  ssoSetup {
    ...SsoSetupFields
  }
}

mutation PairSso($setupUrl: String!, $appUrl: String) {
  pairSso(setupUrl: $setupUrl, appUrl: $appUrl) {
    ...SsoSetupFields
  }
}

mutation UpdateSsoAppUrl($appUrl: String) {
  updateSsoAppUrl(appUrl: $appUrl) {
    setup {
      ...SsoSetupFields
    }
    providerUpdated
    message
  }
}

mutation UnpairSso {
  unpairSso {
    source
  }
}

mutation VerifyOneTimeToken($token: String!) {
  verifyOneTimeToken(token: $token) {
    token
    userId
  }
}

mutation SignOut {
  signOut {
    success
  }
}
