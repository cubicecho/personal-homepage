fragment ItemFields on Item {
  id
  kind
  title
  url
  opensIn
  icon
  iconUrl
  description
  frameHeightPx
  checkEnabled
  checkUrl
  visibleTo
  widget {
    type
    cacheSeconds
    refreshSeconds
    api {
      url
      method
      headers {
        name
        value
      }
      body
      fields {
        label
        path
        format
        warnAbove
        warnBelow
      }
    }
    rss {
      url
      limit
      showSummary
    }
    weather {
      latitude
      longitude
      units
    }
  }
}

fragment SectionFields on Section {
  id
  title
  collapsed
  visibleTo
  items {
    ...ItemFields
  }
}

fragment PageFields on Page {
  slug
  title
  icon
  iconUrl
  isHome
  visibleTo
  sections {
    ...SectionFields
  }
  items {
    ...ItemFields
  }
}

query Pages {
  pages {
    ...PageFields
  }
}

query PageLimits {
  pageLimits {
    maxPages
    maxItemsPerPage
    maxSectionsPerPage
    maxTitleLength
    maxDescriptionLength
    maxUrlLength
    maxSlugLength
    minFrameHeightPx
    maxFrameHeightPx
    defaultFrameHeightPx
    maxWidgetFields
    maxWidgetHeaders
    maxRssEntries
    minWidgetCacheSeconds
    maxWidgetCacheSeconds
    minWidgetRefreshSeconds
    maxWidgetBodyLength
  }
}

mutation CreatePage($input: CreatePageInput!) {
  createPage(input: $input) {
    ...PageFields
  }
}

mutation UpdatePage($slug: ID!, $input: UpdatePageInput!) {
  updatePage(slug: $slug, input: $input) {
    ...PageFields
  }
}

mutation DeletePage($slug: ID!) {
  deletePage(slug: $slug)
}

mutation MovePage($slug: ID!, $toIndex: Int!) {
  movePage(slug: $slug, toIndex: $toIndex) {
    ...PageFields
  }
}

mutation AddItem($pageSlug: ID!, $sectionId: ID, $input: ItemInput!) {
  addItem(pageSlug: $pageSlug, sectionId: $sectionId, input: $input) {
    ...PageFields
  }
}

mutation UpdateItem($pageSlug: ID!, $id: ID!, $input: ItemInput!) {
  updateItem(pageSlug: $pageSlug, id: $id, input: $input) {
    ...PageFields
  }
}

mutation RemoveItem($pageSlug: ID!, $id: ID!) {
  removeItem(pageSlug: $pageSlug, id: $id) {
    ...PageFields
  }
}

mutation MoveItem($pageSlug: ID!, $id: ID!, $toSectionId: ID, $toIndex: Int!) {
  moveItem(pageSlug: $pageSlug, id: $id, toSectionId: $toSectionId, toIndex: $toIndex) {
    ...PageFields
  }
}

mutation AddSection($pageSlug: ID!, $input: SectionInput!) {
  addSection(pageSlug: $pageSlug, input: $input) {
    ...PageFields
  }
}

mutation UpdateSection($pageSlug: ID!, $id: ID!, $input: SectionInput!) {
  updateSection(pageSlug: $pageSlug, id: $id, input: $input) {
    ...PageFields
  }
}

mutation RemoveSection($pageSlug: ID!, $id: ID!) {
  removeSection(pageSlug: $pageSlug, id: $id) {
    ...PageFields
  }
}

mutation MoveSection($pageSlug: ID!, $id: ID!, $toIndex: Int!) {
  moveSection(pageSlug: $pageSlug, id: $id, toIndex: $toIndex) {
    ...PageFields
  }
}
