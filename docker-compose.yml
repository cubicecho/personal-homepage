# The homepage, with its built-in database in a named volume (.env is read from beside this file):
#
#   docker compose up -d --build
#
# A bind mount (./data:/data) works too; the directory must be writable by uid 1000, the image's node user.
# To keep pages in Postgres instead, uncomment the postgres service, DATABASE_URL and depends_on below.
name: personal-homepage
services:
  personal-homepage:
    image: ghcr.io/cubicecho/personal-homepage:latest
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
      # DATABASE_URL: postgres://homepage:${POSTGRES_PASSWORD:-homepage}@postgres:5432/homepage
      # Discovery (Settings, Discovered apps). Dockhand finds containers on every host it manages:
      # DOCKHAND_URL: http://dockhand.lan:3000
      # DOCKHAND_TOKEN: ${DOCKHAND_TOKEN}
      # With the Docker socket mounted below, the name other devices reach this host by:
      # DISCOVERY_DOCKER_HOST: nas.lan
    # mDNS discovery needs host networking: uncomment this and remove `ports:` (the app listens on PORT on the host).
    # network_mode: host
    # depends_on:
    #   postgres: { condition: service_healthy }
    volumes:
      - homepage_data:/data
      # To find this host's containers without Dockhand:
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${PORT:-3000}:3000"

  # postgres:
  #   image: postgres:17-alpine
  #   restart: unless-stopped
  #   environment: { POSTGRES_USER: homepage, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-homepage}", POSTGRES_DB: homepage }
  #   # No `ports`. The database is for the app beside it.
  #   volumes: [homepage_pgdata:/var/lib/postgresql/data]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U homepage -d homepage"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

volumes:
  homepage_data:
  # homepage_pgdata:
